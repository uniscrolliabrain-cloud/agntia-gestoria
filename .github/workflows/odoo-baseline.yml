name: Odoo C01 baseline
on: [push, pull_request]
jobs:
  frozen-source-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_baseline.py --output baseline-verified.json
      - uses: actions/upload-artifact@v4
        with:
          name: odoo-c01-baseline-inventory
          path: baseline-verified.json
