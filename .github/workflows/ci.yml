name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_baseline.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check agntia_gestoria/static/app.js && node --check agntia_gestoria/static/dashboard.js
      - run: node typescript/scripts/build.mjs
      - run: node --test typescript/tests/odoo.test.mjs
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: test-results/
