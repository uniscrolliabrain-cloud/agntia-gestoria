[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agntia-gestoria"
version = "0.1.0"
description = "Gestoría colaborativa para empresas españolas, humanos y agentes"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "python-dotenv>=1,<2", "python-pptx>=1,<2", "reportlab>=4,<5"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "playwright>=1.49,<2"]

[project.scripts]
agntia-gestoria = "agntia_gestoria.cli:main"

[tool.setuptools.packages.find]
include = ["agntia_gestoria*"]

[tool.setuptools.package-data]
agntia_gestoria = ["data/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
